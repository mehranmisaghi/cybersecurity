<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Prova de Segurança de Redes</title>

<style>
body { font-family: Arial; margin: 30px; background: #f5f5f5; }
.container { background: white; padding: 20px; border-radius: 10px; }
.questao { margin-bottom: 20px; padding: 10px; border-left: 5px solid #ccc; }
.correta { background: #d4edda; border-left: 5px solid green; }
.errada { background: #f8d7da; border-left: 5px solid red; }
h2 { text-align: center; }
button { padding: 10px 20px; font-size: 16px; }
.resultado { font-size: 18px; margin-top: 20px; }
</style>

</head>
<body>

<div class="container">
<h2>Teste os seus conhecimentos em RECON</h2>

<form id="quiz">

<!-- GERAR 30 QUESTÕES -->
<script>
const perguntas = [
["O whois é usado para:", "Portas", "Info domínio/IP", "Exploit", "Scan", "Senha", "b"],
["Arping funciona melhor em:", "Internet", "LAN", "Cloud", "DNS", "VPN", "b"],
["Arping usa:", "TCP", "UDP", "ARP", "HTTP", "DNS", "c"],
["Ping sweep identifica:", "Senha", "Hosts ativos", "DNS", "Firewall", "Portas", "b"],
["DNS enum falha quando:", "HTTP off", "Zona bloqueada", "ICMP on", "SSH on", "DNS ok", "b"],
["Banner grabbing revela:", "Firewall", "Versão serviço", "Senha", "DNS", "IP", "b"],
["Banner 'SSH' indica:", "Fechado", "Versão serviço", "DNS", "Firewall", "ICMP", "b"],
["Registro A:", "IPv6", "IPv4", "Email", "Porta", "Alias", "b"],
["Registro AAAA:", "IPv4", "IPv6", "MX", "NS", "TXT", "b"],
["MX define:", "Web", "Email", "DNS", "Porta", "Firewall", "b"],
["NS indica:", "DNS autoritativo", "IP", "Porta", "Firewall", "Gateway", "a"],
["Ping usa:", "TCP", "ICMP", "UDP", "DNS", "ARP", "b"],
["Sem resposta:", "Open", "Closed", "Filtered", "DNS", "Whois", "c"],
["RST indica:", "Open", "Closed", "Filtered", "DNS", "ICMP", "b"],
["Zone transfer permite:", "DDoS", "Listar DNS", "Fechar portas", "Crypto", "Reset", "b"],
["Scan lento evita:", "Firewall", "Detecção", "DNS", "Whois", "ICMP", "b"],
["Firewall stateful bloqueia:", "Tudo", "Inválidas", "DNS", "ARP", "Loopback", "b"],
["Subdomínios aumentam:", "Latência", "Ataque", "DNS", "ICMP", "Firewall", "b"],
["Ocultar banner:", "Hardening", "Exploit", "Scan", "DNS", "Whois", "a"],
["Whois + DNS:", "DDoS", "Mapear infra", "Fechar portas", "Crypto", "Firewall", "b"],
["DNS reverso:", "A", "MX", "PTR", "NS", "AAAA", "c"],
["ARP resolve:", "IP→MAC", "MAC→IP", "DNS", "Porta", "Gateway", "a"],
["SYN scan é:", "Completo", "UDP", "DNS", "Half-open", "ICMP", "d"],
["HTTP porta:", "21", "80", "22", "25", "443", "b"],
["Firewall gera:", "Open", "Closed", "Filtered", "DNS", "Whois", "c"],
["Enumeração fase:", "Recon", "Exploit", "Pós", "Mitigação", "Defesa", "a"],
["DNS brute force:", "Senha", "Porta", "Firewall", "Subdomínio", "IP", "d"],
["TTL DNS:", "Porta", "Cache", "IP", "Host", "Firewall", "b"],
["ICMP type 3:", "OK", "Echo", "Unreachable", "DNS", "HTTP", "c"],
["Recon passivo:", "Whois", "SYN", "Ping", "Banner", "Exploit", "a"]
];

for (let i = 0; i < perguntas.length; i++) {
    let q = perguntas[i];
    document.write(`<div class="questao" id="q${i+1}">
    <p>${i+1}. ${q[0]}</p>
    <input type="radio" name="q${i+1}" value="a"> ${q[1]}<br>
    <input type="radio" name="q${i+1}" value="b"> ${q[2]}<br>
    <input type="radio" name="q${i+1}" value="c"> ${q[3]}<br>
    <input type="radio" name="q${i+1}" value="d"> ${q[4]}<br>
    <input type="radio" name="q${i+1}" value="e"> ${q[5]}<br>
    </div>`);
}
</script>

<br>
<button type="button" onclick="corrigir()">Finalizar</button>
</form>

<div class="resultado" id="resultado"></div>

</div>

<script>
function corrigir() {
    let acertos = 0;

    for (let i = 0; i < perguntas.length; i++) {
        let correta = perguntas[i][6];
        let qid = "q" + (i+1);
        let questao = document.getElementById(qid);
        let sel = document.querySelector(`input[name="${qid}"]:checked`);

        if (sel && sel.value === correta) {
            acertos++;
            questao.classList.add("correta");
            questao.innerHTML += "<p>✅ Correto</p>";
        } else {
            questao.classList.add("errada");
            questao.innerHTML += `<p>❌ Correta: ${correta.toUpperCase()}</p>`;
        }
    }

    document.getElementById("resultado").innerText =
        "Resultado: " + acertos + " / 30";
}
</script>

</body>
</html>
